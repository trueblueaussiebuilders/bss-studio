name: Pull Instagram insights

on:
  schedule:
    - cron: "17 20 * * *"   # daily, ~7:17am Melbourne (daylight saving), well clear of the 08:30 UTC post run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch metrics for every posted media
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish/insights.py --posted posted.txt --out insights.csv

      - name: Summary
        run: |
          {
            echo "### Instagram insights"
            echo '```'
            column -s, -t < insights.csv | cut -c1-220
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit insights.csv
        run: |
          git config user.name "bss-bot"
          git config user.email "bss-bot@users.noreply.github.com"
          git add insights.csv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Insights $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
